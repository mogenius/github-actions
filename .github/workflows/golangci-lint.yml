name: golangci-lint

on:
  workflow_call:
    inputs:
      path:
        description: 'Working directory (path to module root)'
        required: false
        default: '.'
        type: string
      go_version:
        description: 'Go version to use'
        required: false
        default: 'stable'
        type: string
      golangci_lint_version:
        description: 'golangci-lint version'
        required: false
        default: 'v2.13.2' # renovate: datasource=github-releases depName=golangci/golangci-lint
        type: string
      args:
        description: 'Extra arguments passed to golangci-lint run'
        required: false
        default: ''
        type: string
      runner:
        description: 'Runner label'
        required: false
        default: 'self-hosted'
        type: string

jobs:
  golangci-lint:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ARC runners start from a clean container, so $GOMODCACHE and $GOCACHE do not
      # exist yet. actions/cache resolves its paths via glob and aborts the restore
      # ("Some specified paths were not resolved") when they are missing, which
      # silently disabled the Go cache on every run. Create them up front.
      - name: Prepare Go cache dirs
        run: mkdir -p ~/go/pkg/mod ~/.cache/go-build

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: false

      # Restored separately instead of via setup-go's `cache: true`: setup-go only
      # looks up an exact go.sum hash and has no restore-keys fallback, so every
      # dependency bump rebuilt the whole module graph from scratch.
      - name: Restore Go build & module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # `path` is the directory the tool runs in, which is not always the module
          # root: a repo may keep go.mod at the top level and point the job at a
          # subdirectory. hashFiles returns an empty string for a file that does not
          # exist, which would collapse the key to a constant that never invalidates,
          # so fall back to the repo-root go.sum.
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ inputs.go_version }}-${{ hashFiles(format('{0}/go.sum', inputs.path)) || hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ inputs.go_version }}-
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci_lint_version }}
          working-directory: ${{ inputs.path }}
          args: ${{ inputs.args }}
